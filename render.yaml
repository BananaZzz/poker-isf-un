# Render Blueprint for Golden Room Poker
# https://render.com/docs/blueprint-spec
#
# Free plan usage:
#   - `plan: free` gives one always-available web service with 512 MB RAM.
#   - The instance sleeps after ~15 minutes of inactivity; the next request
#     takes ~30 seconds to wake it. Users may see one slow initial load.
#   - Uploaded avatars land in /public/uploads on the container's ephemeral
#     filesystem and disappear whenever Render redeploys. Prefer the built-in
#     casino avatars for a first public MVP.
#
# Database:
#   This blueprint intentionally does NOT provision the database. Use Neon's
#   free tier and paste the connection string into the DATABASE_URL env var
#   below (Render → Environment). See README "Free Public Deployment".
services:
  - type: web
    name: golden-room-poker
    runtime: node
    plan: free
    region: frankfurt        # change if you want a different region
    branch: claude/texas-holdem-poker-platform-nj4y14
    autoDeploy: true
    healthCheckPath: /api/health
    # --include=dev is required: NODE_ENV is set to "production" for the whole
    # service (Render + our runtime code both need it), and that causes
    # `npm ci` to skip devDependencies by default. Without devDeps installed,
    # Next.js can't load `typescript` — and without TypeScript loaded it does
    # NOT register the `paths` entries from tsconfig.json, which produces
    # cryptic "Module not found: Can't resolve '@/lib/*'" errors at build.
    # `--include=dev` re-enables devDeps for the build step only.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma db push --accept-data-loss --skip-generate && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.11.1"
      # Belt-and-braces: also disable npm's "production-only" mode so that
      # any future script or subshell reading NPM_CONFIG_PRODUCTION doesn't
      # accidentally skip build tooling.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: SESSION_SECRET
        generateValue: true   # Render generates a strong random value on first deploy
      - key: DATABASE_URL
        sync: false           # paste your Neon pooled connection string here after first deploy
